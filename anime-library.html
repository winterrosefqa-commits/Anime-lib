<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Anime Library</title>
<style>
:root{--bg:#0b1622;--panel:#151f2e;--field:#1b2a3d;--text:#9fadbd;--hi:#e6edf5;--accent:#3db4f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:600 14px/1.4 "Overpass","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:28px 40px 120px}
.filters{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.logo{margin-left:auto;height:84px;width:auto;align-self:flex-start;margin-top:-10px}
.filters label{display:block;margin-bottom:8px;color:var(--hi)}
.filters input{background:var(--field);border:0;border-radius:4px;padding:11px 14px;min-width:240px;color:var(--text);font:inherit;outline:none}
input:focus-visible,.card:focus-visible,.ep:focus-visible{outline:2px solid var(--accent)}
h2{color:var(--hi);font-size:15px;margin:0 0 18px;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,185px));gap:24px 22px;align-items:start}
.card{position:relative;width:185px;color:var(--hi);cursor:pointer;z-index:1;transition:transform .35s cubic-bezier(.2,.8,.2,1),z-index 0s .35s}
.card:hover,.card:focus-within,.card.open{transform:scale(1.12);z-index:5;transition:transform .35s cubic-bezier(.2,.8,.2,1),z-index 0s}
.cover{aspect-ratio:185/265;border-radius:4px;background:#000 center/cover;transition:box-shadow .35s}
.card:hover .cover,.card.open .cover{box-shadow:0 14px 34px #000a}
.t{margin-top:10px;font-size:13.5px;line-height:1.35}
.m{font-size:12px;color:var(--text);margin-top:2px}
.drop{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--panel);border-radius:6px;box-shadow:0 14px 34px #000b;max-height:0;opacity:0;overflow:hidden;pointer-events:none;transition:max-height .3s ease,opacity .2s}
.card.open .drop{max-height:260px;opacity:1;pointer-events:auto;overflow:auto}
.drop h4{margin:0;padding:12px 12px 6px;font-size:12px;color:var(--text);font-weight:700}
.ep{display:block;width:100%;text-align:left;background:none;border:0;color:var(--hi);font:inherit;font-size:13px;padding:9px 12px;cursor:pointer}
.ep:hover{background:var(--field);color:var(--accent)}
.empty{color:var(--text);padding:30px 0}

#watch{display:none;--ac:#5b4dff;--pn:#12122b;--ln:#25254d}
#watch .wrap2{max-width:1200px;margin:0 auto;padding:20px 24px 80px}
.wtop{margin-bottom:14px}
.wbtn{background:var(--pn);border:1px solid var(--ln);color:var(--hi);font:inherit;font-size:12px;padding:9px 14px;border-radius:4px;cursor:pointer}
.wbtn:hover{border-color:var(--ac)}
.vbox{position:relative;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:#000}
.vbox video{display:block;width:100%;max-height:72vh;background:#000}
.vtitle{position:absolute;left:18px;top:14px;pointer-events:none;text-shadow:0 1px 6px #000;transition:opacity .3s}
.vtitle b{display:block;color:#fff;font-size:15px}.vtitle span{font-size:12px;color:#cfd3ff}
.vbox.playing .vtitle{opacity:0}.vbox.playing:hover .vtitle{opacity:1}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px;background:var(--pn);border:1px solid var(--ln);border-radius:6px}
.bar .sp{flex:1}
.pill{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.pill[disabled],.wbtn[disabled]{opacity:.4;cursor:default}
.info{margin-top:18px;background:var(--pn);border:1px solid var(--ln);border-radius:6px}
.now{display:flex;gap:16px;padding:20px}
.now img{width:85px;height:128px;object-fit:cover;border-radius:3px;border:1px solid var(--ln)}
.now small{color:#8b86ff;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.now h1{margin:6px 0 10px;color:#fff;font-size:30px;line-height:1.1}
.tags span{display:inline-block;background:#1c1c40;color:#cfd3ff;font-size:11px;padding:5px 9px;border-radius:3px;margin-right:6px}
.prog{display:flex;align-items:center;gap:20px;justify-content:space-between;border-top:1px solid var(--ln);padding:18px 20px;flex-wrap:wrap}
.prog .l{flex:1;min-width:220px;color:#fff}
.prog .l div{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px}
.prog .l div span{color:#8b86ff;font-weight:600}
.track{height:6px;background:#1c1c40;border-radius:3px}.track i{display:block;height:100%;width:7.7%;background:var(--ac);border-radius:3px}
.next{display:flex;gap:12px;align-items:center;background:#0d0d22;border:1px solid var(--ln);border-radius:4px;padding:6px 14px 6px 6px;color:#fff;cursor:default}
.next img{width:60px;height:38px;object-fit:cover;border-radius:3px}
.next small{display:block;font-size:10px;letter-spacing:.08em;color:#8b86ff}
</style>
</head>

<script>
const card=document.getElementById('lain');
function setOpen(o){card.classList.toggle('open',o);card.setAttribute('aria-expanded',o)}
card.addEventListener('click',e=>{if(e.target.closest('.drop'))return;setOpen(!card.classList.contains('open'))});
card.addEventListener('keydown',e=>{if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();card.click()}if(e.key==='Escape')setOpen(false)});
document.addEventListener('click',e=>{if(!card.contains(e.target))setOpen(false)});
// episodes 2-13 do nothing yet
document.querySelectorAll('.ep:not(#ep1)').forEach(b=>b.addEventListener('click',e=>e.stopPropagation()));
document.getElementById('q').addEventListener('input',e=>{
 const v=e.target.value.toLowerCase().trim(),show=card.dataset.title.includes(v)||'lain'.includes(v);
 card.style.display=show?'':'none';document.getElementById('none').hidden=show});

const home=document.querySelector('.wrap'),watch=document.getElementById('watch'),v=document.getElementById('v'),vbox=document.getElementById('vbox');
function openEp1(){home.style.display='none';watch.style.display='block';window.scrollTo(0,0);
 if(!v.getAttribute('src'))v.src='Lain_ep1.mp4';v.play().catch(()=>{})}
document.getElementById('ep1').addEventListener('click',e=>{e.stopPropagation();openEp1()});
document.getElementById('back').addEventListener('click',()=>{v.pause();watch.style.display='none';home.style.display='';setOpen(false)});
v.addEventListener('play',()=>vbox.classList.add('playing'));
v.addEventListener('pause',()=>vbox.classList.remove('playing'));
v.addEventListener('error',()=>{document.getElementById('vsub').textContent='Episode 1 · Lain_ep1.mp4 not found. Keep it in the same folder as this page.'});
const mw=document.getElementById('mw');
try{if(localStorage.getItem('lain1'))mw.textContent='Watched'}catch(e){}
mw.addEventListener('click',()=>{const on=mw.textContent!=='Watched';mw.textContent=on?'Watched':'Mark watched';
 try{on?localStorage.setItem('lain1','1'):localStorage.removeItem('lain1')}catch(e){}});
</script>
